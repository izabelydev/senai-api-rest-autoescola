services:
  db:
    image: mysql:latest
    container_name: autoescolaN321-mysql-prod
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_USER: ${DBN_USER}
      MYSQL_PASSWORD: ${DBN_PASSWORD}
      MYSQL_DATABASE: ${DBN_NAME}
      MYSQL_ROOT_PASSWORD: ${DBN_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - autoescolaN321-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DBN_USER}", "-p${DBN_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-prod
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RBT_PASSWORD: ${RBT_PASSWORD}
      RBT_USER: ${RBT_USER}
    networks:
      - autoescolaN321-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoescola_n321
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: ${ENVIRONMENT}
      DBN_URL: ${DBN_URL}
      DBN_USER: ${DBN_USER}
      DBN_PASSWORD: ${DBN_PASSWORD}
      DBN_NAME: ${DBN_NAME}
      RBT_PASSWORD: ${RBT_PASSWORD}
      RBT_USER: ${RBT_USER}
      MAIL_PASSWORD_APP: ${MAIL_PASSWORD_APP}
      MAIL_USERNAME:
    networks:
      - autoescolaN321-network
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  db_data:

networks:
  autoescolaN321-network:
    driver: bridge
