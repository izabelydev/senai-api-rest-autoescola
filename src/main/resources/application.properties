server.port=8085
spring.application.name=autoescola_n321
#spring.jackson.property-naming-strategy=SNAKE_CASE
server.error.include-stacktrace=never
api.security.token.secret=${JWT_SECRET}

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DBN_URL}
spring.datasource.username=${DBN_USER}
spring.datasource.password=${DBN_PASSWORD}

# RabbitMQ
spring.rabbitmq.post=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RBT_USER}
spring.rabbitmq.password=${RBT_PASSWORD}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD_APP}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
